name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # standard library only: there is no go.sum to key a cache on

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage gate
        run: |
          go test -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 85) }' || { echo "Coverage below 85%"; exit 1; }

      - name: Build container image
        run: docker build -t print-quote-service .
